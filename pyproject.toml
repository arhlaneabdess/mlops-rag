[project]
name = "legal-rag"
version = "0.1.0"
description = "Production Bilingual Arabic Legal RAG System for Egyptian Civil Code"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.1.0",
    "python-json-logger>=2.0.7",
    "httpx>=0.27.0",
    "python-bidi>=0.4.2",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "mlflow>=2.11.0",
     "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
    "dvc>=3.48.0",
    "dvc-s3>=3.1.0",
    "mlflow>=2.11.0",
    "boto3>=1.34.0",
    "bentoml>=1.2.0",
    "openai>=1.20.0",
    "locust>=2.24.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-v --cov=src/legal_rag --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501", "ASYNC230"]

[tool.black]
line-length = 100
target-version = ["py310"]
