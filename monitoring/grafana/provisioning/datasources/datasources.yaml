apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL-DriftStore
    type: postgres
    access: proxy
    url: postgres:5432
    user: mlflow
    database: mlflowdb
    jsonData:
      sslmode: "disable"
    secureJsonData:
      password: "mlflowpassword"
    editable: false