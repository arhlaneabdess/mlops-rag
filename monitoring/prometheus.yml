global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  - job_name: "legal-rag-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["legal-rag-api:8000"]
        labels:
          environment: "production"
          service: "legal-rag-api"