services:
  # 1. PostgreSQL - Metadata backend for MLflow
  postgres:
    image: postgres:15-alpine
    container_name: legal-rag-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpassword
      POSTGRES_DB: mlflowdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflowdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MinIO - Local S3-compatible Object Storage for MLflow & DVC
  minio:
    image: alpine/minio:latest-release
    container_name: legal-rag-minio
    user: root
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    entrypoint: sh
    command: -c "mkdir -p /data/mlflow /data/prodml-dvc && minio server /data --console-address ':9001'"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: legal-rag-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary boto3 &&
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflowpassword@postgres:5432/mlflowdb
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000"
    restart: unless-stopped

  # 4. FastAPI Legal RAG Application
  legal-rag-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: legal-rag-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - PROJECT_ROOT=/app
      - DATA_DIR=/app/data
      - PROCESSED_JSON_PATH=/app/data/processed/egyptian_civil_code.json
      - CHUNKS_JSON_PATH=/app/data/processed/chunks.json
      - CHROMA_DB_DIR=/app/data/processed/chroma_db
    volumes:
      - ../data/processed:/app/data/processed
    restart: unless-stopped
  # 5. Prometheus Metrics Engine
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: legal-rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../monitoring/rules:/etc/prometheus/rules
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
  # 6. Langfuse LLM Observability & Tracing Engine
  langfuse:
    image: langfuse/langfuse:2
    container_name: legal-rag-langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://mlflow:mlflowpassword@postgres:5432/langfusedb
      - NEXTAUTH_SECRET=mysecretkey123456789012345678901234
      - SALT=mysalt123456789012345678901234
      - NEXTAUTH_URL=http://localhost:3001
      - TELEMETRY_ENABLED=false
    restart: unless-stopped
  # 7. Grafana Dashboard as Code (Port 3002)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: legal-rag-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: